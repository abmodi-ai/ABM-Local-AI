[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
